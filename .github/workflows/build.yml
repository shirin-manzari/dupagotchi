name: Build desktop apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add Windows compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION\ucrt64\bin"
      - run: npm ci
      - run: npm test
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Smoke test Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Smoke test desktop
        if: runner.os != 'Linux'
        run: npm run smoke
      - run: npm run package
      - name: Test packaged emulator
        run: node scripts/check-core.mjs --packaged
      - name: Archive Linux bundle with executable permissions
        if: runner.os == 'Linux'
        run: tar -czf release/DuPaGotchi-linux.tar.gz -C release DuPaGotchi-linux-x64
      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "release/DuPaGotchi-darwin-$(node -p process.arch)" release/DuPaGotchi-macos.zip
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/DuPaGotchi-win32-x64 -DestinationPath release/DuPaGotchi-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DuPaGotchi-${{ runner.os }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
